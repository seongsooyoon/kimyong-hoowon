<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>김용 후원 공유카드</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;overflow:hidden;
       font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
       background:#08213F}
  .card{width:1080px;height:1350px;background:#08213F;display:flex;flex-direction:column}
  .poster{width:1080px;display:block}
  .band{flex:1;display:flex;align-items:center;gap:34px;padding:26px 40px 30px;
        background:linear-gradient(180deg,#0B2A50 0%,#08213F 100%)}
  .qr{width:250px;height:250px;flex:none;background:#fff;border-radius:20px;padding:12px;
      box-shadow:0 10px 26px -12px rgba(0,0,0,.8)}
  .qr img{width:100%;height:100%;display:block}
  .txt{flex:1;color:#fff;min-width:0}
  .t1{font-size:37px;font-weight:900;letter-spacing:-1px;line-height:1.25;color:#FFD400}
  .t2{font-size:26px;font-weight:700;color:#cfe0f5;margin-top:8px;line-height:1.35}
  .url{margin-top:16px;background:#fff;border-radius:14px;padding:14px 16px;
       font-size:25px;font-weight:800;color:#0050A5;letter-spacing:-.6px;word-break:break-all;text-align:center}
  .t3{margin-top:14px;font-size:24px;font-weight:800;color:#fff;line-height:1.4}
  .t3 b{color:#FFD400}
</style></head>
<body>
<div class="card">
  <img class="poster" src="assets/poster_share.jpg" alt="후원회장 우원식 · 기호 2 민주당 최고위원 후보 김용">
  <div class="band">
    <div class="qr"><img src="assets/qr.png" alt="후원 페이지 QR"></div>
    <div class="txt">
      <div class="t1">📱 QR 스캔 → 바로 후원</div>
      <div class="t2">계좌번호 한 번만 누르면 복사됩니다</div>
      <div class="url">seongsooyoon.github.io/kimyong-hoowon</div>
      <div class="t3">10만원까지 <b>전액 세액공제</b> · 연간 500만원 한도</div>
    </div>
  </div>
</div>
</body></html>
